[package]
name = "aitools"
version = "0.1.0"
description = "A Tauri App"
edition = "2024"

# 桌面应用仅需 rlib；staticlib/cdylib 供移动端使用
[lib]
name = "aitools_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
rand = "0.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
